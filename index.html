<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcana Portals</title>
    
    <!-- 1. Netlify Identity Widget for Mobile Admin Login -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
        /* Base Theme */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
            /* Smooth fade when switching background colors */
            transition: background 0.6s ease; 
        }
        
        #thumbnails-view, #gallery-view {
            max-width: 1200px;
            margin: 0 auto;
        }

        #gallery-view {
            display: none; /* Hidden until a portal is clicked */
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        .branch-card {
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .branch-card:hover {
            transform: scale(1.05);
        }

        .branch-card img {
            width: 100%;
            max-width: 250px;
            border-radius: 8px;
        }

        #gallery-grid img {
            width: 100%;
            border-radius: 4px;
            object-fit: cover;
        }

        button.back-btn {
            background: transparent;
            color: white;
            border: 1px solid white;
            padding: 10px 20px;
            cursor: pointer;
            margin-bottom: 20px;
            font-family: inherit;
            transition: background 0.3s;
        }

        button.back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* 2. Lightbox CSS */
        dialog#image-lightbox {
            background: rgba(0, 0, 0, 0.9);
            border: none;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            margin: 0;
            padding: 0;
            position: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Forces the dialog to stay hidden until triggered by JS */
        dialog#image-lightbox:not([open]) {
            display: none; 
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 90vh;
        }

        #lightbox-image {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .close-btn {
            position: absolute;
            top: -40px;
            right: 0;
            color: #fff;
            font-size: 40px;
            cursor: pointer;
            line-height: 1;
        }
    </style>
</head>
<body>

    <!-- Main Thumbnails View -->
    <div id="thumbnails-view">
        <h1>✦ CONIUNCTIO ✦</h1>
        <div id="branches-grid" class="grid"></div>
    </div>

    <!-- Single Portal Gallery View -->
    <div id="gallery-view">
        <button class="back-btn" onclick="closeGallery()">← Return to Portals</button>
        <h1 id="gallery-title"></h1>
        <div id="gallery-grid" class="grid"></div>
    </div>

    <!-- 3. Lightbox HTML Structure -->
    <dialog id="image-lightbox">
        <div class="lightbox-content">
            <span class="close-btn" onclick="document.getElementById('image-lightbox').close()">&times;</span>
            <img id="lightbox-image" src="" alt="Expanded view">
        </div>
    </dialog>

    <script>
        // Optional: Redirect to the admin panel if Janice logs in from the homepage
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }

        let branchesData = [];
        const thumbnailsView = document.getElementById('thumbnails-view');
        const galleryView = document.getElementById('gallery-view');
        const branchesGrid = document.getElementById('branches-grid');
        const galleryTitle = document.getElementById('gallery-title');
        const galleryGrid = document.getElementById('gallery-grid');

        // Fetch Data
        fetch('branches.json')
            .then(response => response.json())
            .then(data => {
                // Failsafe: Handles both Python's raw list and Decap CMS's object structure
                branchesData = data.portals ? data.portals : data;
                renderThumbnails();
            })
            .catch(err => console.error("Error loading branches:", err));

        // Render Homepage Menu
        function renderThumbnails() {
            branchesGrid.innerHTML = '';
            branchesData.forEach(branch => {
                const card = document.createElement('div');
                card.className = 'branch-card';
                card.onclick = () => openGallery(branch.id);

                card.innerHTML = `
                    <img src="${branch.thumbnail}" alt="${branch.name}">
                    <h3>${branch.name}</h3>
                `;
                branchesGrid.appendChild(card);
            });
        }

        // 4. Enhanced Gallery Function (Backgrounds, Lazy Load, Lightbox)
        function openGallery(branchId) {
            const branch = branchesData.find(b => b.id === branchId);
            if (!branch) return;

            // Switch Views
            thumbnailsView.style.display = 'none';
            galleryView.style.display = 'block';
            galleryTitle.innerText = branch.name;
            galleryGrid.innerHTML = '';

            // Apply custom background if it exists, otherwise default to black
            if (branch.bg_image) {
                document.body.style.backgroundImage = `url(${branch.bg_image})`;
                document.body.style.backgroundSize = "cover";
                document.body.style.backgroundPosition = "center";
                document.body.style.backgroundColor = branch.bg_color || "#000000";
            } else {
                document.body.style.backgroundImage = "none";
                document.body.style.backgroundColor = branch.bg_color || "#000000";
            }

            // Loop through and render images
            branch.images.forEach(imgUrl => {
                const imgEl = document.createElement('img');
                imgEl.src = imgUrl;
                
                // --- NEW OPTIMIZATIONS ---
                imgEl.loading = 'lazy';           // Saves bandwidth
                imgEl.style.cursor = 'pointer';   // Shows it is clickable

                imgEl.onclick = function() {      // Opens the Lightbox
                    const lightbox = document.getElementById('image-lightbox');
                    const lightboxImg = document.getElementById('lightbox-image');
                    lightboxImg.src = this.src;
                    lightbox.showModal();
                };
                
                galleryGrid.appendChild(imgEl);
            });
        }

        // 5. Close Gallery Function
        function closeGallery() {
            galleryView.style.display = 'none';
            thumbnailsView.style.display = 'block';
            
            // Reset background back to default black for the main menu
            document.body.style.backgroundImage = "none";
            document.body.style.backgroundColor = "#000000";
        }
    </script>
</body>
</html>
